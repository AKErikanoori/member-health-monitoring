<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Monitor · PT Sugity Creatives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}
    button,input,select{font-family:inherit}
    button{transition:opacity .15s,transform .12s}
    button:active{opacity:.85;transform:scale(.97)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#f1f5f9}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .animate-in{animation:fadeIn .25s ease}
    .slide-in{animation:slideIn .25s ease}
    .stat-card{cursor:pointer;transition:transform .15s,box-shadow .15s!important}
    .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)!important}
    .row-hover:hover{background:#f0fdf4!important}
    @media(min-width:768px){
      .wide{max-width:940px!important}
      .stat-row{grid-template-columns:repeat(4,1fr)!important}
      .pgrid{display:grid!important;grid-template-columns:1fr 1fr;gap:12px!important}
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
// ═══════════════════════════════════════════════════════
// ⚡  GANTI FIREBASE CONFIG KAMU DI SINI
//    Ambil dari: Firebase Console → Project Settings → Your apps
// ═══════════════════════════════════════════════════════
var FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDEC8EmApdFsSU0slo5kjWBRxO5o1x4ED4",
  authDomain:        "member-healty-monitoring.firebaseapp.com",
  projectId:         "member-healty-monitoring",
  storageBucket:     "member-healty-monitoring.firebasestorage.app",
  messagingSenderId: "871456288629",
  appId:             "1:871456288629:web:9d832ddb5833f78a642d3c"
};
// ═══════════════════════════════════════════════════════

firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();
var membersCol = function(){ return db.collection("members"); };
var configDoc  = function(){ return db.collection("config").doc("pins"); };
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const DEPTS = ["Produksi","Packing","Polibox","Delivery","Planning","Quality Control",
  "Engineering","Maintenance","Purchasing","Logistik","HRD","Finance","General Affairs",
  "IT / Digitalisasi","Manajemen"];
const MONTHS = ["Mei","Jun","Jul"];
const PARAMS = [
  {key:"beratBadan",label:"Berat Badan",unit:"kg",ph:"68"},
  {key:"tensi",label:"Tensi",unit:"mmHg",ph:"120/80"},
  {key:"gulaDarah",label:"Gula Darah",unit:"mg/dL",ph:"95"},
  {key:"kolesterol",label:"Kolesterol",unit:"mg/dL",ph:"180"},
  {key:"asamUrat",label:"Asam Urat",unit:"mg/dL",ph:"5.5"},
  {key:"bodyFat",label:"Body Fat",unit:"%",ph:"22"},
  {key:"viseral",label:"Visceral Fat",unit:"lvl",ph:"7"},
  {key:"bmi",label:"BMI",unit:"",ph:"22.5"},
  {key:"bodyAge",label:"Body Age",unit:"thn",ph:"32"},
];

// ─── KPI CLASSIFICATION ───────────────────────────────────────────────────────
// Sumber: AHA/ACC 2017, ADA 2024, JNC 8, WHO, Kemenkes RI 2021
const KPI = {
  kolesterol: {
    label:"Kolesterol",ref:"≥ 200 mg/dL",
    refFull:"≥200 mg/dL · Borderline: 200–239 · High: ≥240 (AHA/ACC)",
    isTinggi: v => +v >= 200,
  },
  gulaDarah: {
    label:"Gula Darah",ref:"≥ 100 mg/dL",
    refFull:"≥100 mg/dL · Pre-diabetes: 100–125 · DM: ≥126 (ADA 2024)",
    isTinggi: v => +v >= 100,
  },
  tensi: {
    label:"Tensi",ref:"≥ 140/90 mmHg",
    refFull:"≥140 sistol atau ≥90 diastol (Hipertensi Stage 2 – JNC 8 / Kemenkes RI)",
    isTinggi: v => { const[s,d]=(v||"").split("/").map(Number); return s>=140||d>=90; },
  },
  bmi: {
    label:"BMI",ref:"> 30",
    refFull:">30 (Obese Class I – WHO) · Populasi Asia: >27.5 sudah berisiko",
    isTinggi: v => +v > 30,
  },
};
const KPI_KEYS = Object.keys(KPI);

const PARAM_JUDGE = {
  beratBadan:{judge:()=>null,std:"Ideal"},
  tensi:{std:"<120/80",judge:v=>{const[s,d]=(v||"").split("/").map(Number);if(!s||!d)return null;if(s<120&&d<80)return"N";if(s<140&&d<90)return"W";return"X";}},
  gulaDarah:{std:"<100",judge:v=>{const n=+v;if(!n)return null;return n<100?"N":n<126?"W":"X";}},
  kolesterol:{std:"<200",judge:v=>{const n=+v;if(!n)return null;return n<200?"N":n<240?"W":"X";}},
  asamUrat:{std:"L≤7/P≤6",judge:(v,g)=>{const n=+v;if(!n)return null;const l=g==="P"?6:7;return n<=l?"N":n<=l+1?"W":"X";}},
  bodyFat:{std:"<25%",judge:v=>{const n=+v;if(!n)return null;return n<25?"N":n<30?"W":"X";}},
  viseral:{std:"≤9",judge:v=>{const n=+v;if(!n)return null;return n<=9?"N":n<=14?"W":"X";}},
  bmi:{std:"18.5–24.9",judge:v=>{const n=+v;if(!n)return null;return(n>=18.5&&n<25)?"N":n<30?"W":"X";}},
  bodyAge:{std:"≤Usia",judge:(v,_,u)=>{const n=+v,a=+u;if(!n||!a)return null;return n<=a?"N":n<=a+5?"W":"X";}},
};

const JC = {
  N:{l:"Normal",e:"✅",bg:"#dcfce7",bd:"#4ade80",tx:"#15803d",dark:"#166534"},
  W:{l:"Perhatian",e:"⚠️",bg:"#fef9c3",bd:"#facc15",tx:"#92400e",dark:"#78350f"},
  X:{l:"Bahaya",e:"🚨",bg:"#fee2e2",bd:"#f87171",tx:"#991b1b",dark:"#7f1d1d"},
  null:{l:"Belum diisi",e:"—",bg:"#f8fafc",bd:"#e2e8f0",tx:"#94a3b8",dark:"#475569"},
};
const DEPT_COLORS=["#3b82f6","#8b5cf6","#ec4899","#f59e0b","#10b981","#06b6d4","#ef4444","#84cc16","#f97316","#6366f1","#14b8a6","#e11d48","#7c3aed","#0ea5e9","#22c55e"];

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const emptyData   = () => MONTHS.reduce((a,m)=>({...a,[m]:PARAMS.reduce((b,p)=>({...b,[p.key]:""}),{})}),{});
const deptColor   = d => DEPT_COLORS[DEPTS.indexOf(d)%DEPT_COLORS.length]||"#6b7280";
const monthFill   = (m,mo) => Math.round(PARAMS.filter(p=>m.data?.[mo]?.[p.key]).length/PARAMS.length*100);

const getKpiBad = m => {
  const latestMo = [...MONTHS].reverse().find(mo=>KPI_KEYS.some(k=>m.data?.[mo]?.[k]));
  if(!latestMo) return [];
  return KPI_KEYS.filter(k=>m.data?.[latestMo]?.[k]&&KPI[k].isTinggi(m.data[latestMo][k]));
};
const getKpiStatus = m => {
  const hasData = KPI_KEYS.some(k=>MONTHS.some(mo=>m.data?.[mo]?.[k]));
  if(!hasData) return null;
  const bad = getKpiBad(m);
  if(bad.length>=2) return "X";
  if(bad.length===1) return "W";
  return "N";
};
const getLatestMonth = m =>
  [...MONTHS].reverse().find(mo=>KPI_KEYS.some(k=>m.data?.[mo]?.[k]))||null;

// ─── FIREBASE HELPERS ─────────────────────────────────────────────────────────
const fbSaveMember = async m => {
  const {id,...data} = m;
  await membersCol().doc(String(id)).set(data);
};
const fbDeleteMember = async id => { await membersCol().doc(String(id)).delete(); };
const fbSaveConfig  = async pins => { await configDoc().set(pins); };

// ─── UI COMPONENTS ────────────────────────────────────────────────────────────
function StatusBadge({j,small=false}) {
  const c=JC[j]||JC[null];
  return <span style={{display:"inline-flex",alignItems:"center",gap:3,background:c.bg,color:c.tx,
    border:`1.5px solid ${c.bd}`,borderRadius:20,padding:small?"2px 7px":"3px 10px",
    fontSize:small?10:11,fontWeight:700,whiteSpace:"nowrap"}}>{c.e&&c.e+" "}{c.l}</span>;
}

function Avatar({nama="?",status,size=44}) {
  const c=JC[status]||JC[null];
  return <div style={{width:size,height:size,borderRadius:"50%",flexShrink:0,
    background:`linear-gradient(135deg,${c.bg},${c.bd})`,border:`2.5px solid ${c.bd}`,
    display:"flex",alignItems:"center",justifyContent:"center",
    fontWeight:900,fontSize:size*.38,color:c.tx}}>{nama[0]?.toUpperCase()||"?"}</div>;
}

function DeptTag({dept,small=false}) {
  const c=deptColor(dept);
  return <span style={{background:c+"18",color:c,border:`1.5px solid ${c}40`,
    borderRadius:6,padding:small?"1px 6px":"2px 8px",fontSize:small?10:11,fontWeight:700,whiteSpace:"nowrap"}}>{dept}</span>;
}

function PinPad({onSubmit,error,label}) {
  const [p,setP]=useState(["","","",""]);
  const refs=[useRef(),useRef(),useRef(),useRef()];
  useEffect(()=>refs[0].current?.focus(),[]);
  const press=(i,v)=>{
    if(!/^\d$/.test(v)&&v!=="")return;
    const n=[...p]; n[i]=v; setP(n);
    if(v&&i<3)refs[i+1].current?.focus();
    if(v&&i===3){const f=n.join(""); if(f.length===4)setTimeout(()=>onSubmit(f),80);}
  };
  const back=(i,e)=>{if(e.key==="Backspace"&&!p[i]&&i>0)refs[i-1].current?.focus();};
  return (
    <div>
      {label&&<p style={{textAlign:"center",color:"#64748b",fontSize:13,marginBottom:20}}>{label}</p>}
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:14}}>
        {p.map((v,i)=>(
          <input key={i} ref={refs[i]} type="password" inputMode="numeric" maxLength={1} value={v}
            onChange={e=>press(i,e.target.value)} onKeyDown={e=>back(i,e)}
            style={{width:58,height:68,textAlign:"center",fontSize:30,fontWeight:900,fontFamily:"monospace",
              border:error?"2px solid #ef4444":`2px solid ${v?"#10b981":"#e2e8f0"}`,
              borderRadius:16,background:v?"#ecfdf5":"#fff",color:"#064e3b",outline:"none",
              boxShadow:v?"0 4px 14px rgba(16,185,129,.25)":"0 1px 4px rgba(0,0,0,.06)",transition:"all .15s"}}/>
        ))}
      </div>
      {error&&<div style={{textAlign:"center",color:"#dc2626",fontSize:13,fontWeight:600,background:"#fee2e2",borderRadius:10,padding:"10px 16px"}}>❌ PIN salah, coba lagi</div>}
    </div>
  );
}

// ─── STATUS PANEL ─────────────────────────────────────────────────────────────
function StatusPanel({status,members,onSelectMember,onClose}) {
  const jc=JC[status]||JC[null];
  const filteredM=members.filter(m=>getKpiStatus(m)===status);
  const usedDepts=DEPTS.filter(d=>filteredM.some(m=>m.bagian===d));
  return (
    <div onClick={onClose}
      style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,.5)",backdropFilter:"blur(4px)",display:"flex",justifyContent:"flex-end"}}>
      <div className="slide-in" onClick={e=>e.stopPropagation()}
        style={{width:"min(430px,100%)",background:"#fff",height:"100%",display:"flex",flexDirection:"column",boxShadow:"-4px 0 40px rgba(0,0,0,.2)"}}>
        {/* Header */}
        <div style={{background:`linear-gradient(135deg,${jc.dark},${jc.dark}cc)`,padding:"20px 20px 16px",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{color:"#fff",fontWeight:900,fontSize:20}}>{jc.e} Member {jc.l}</div>
              <div style={{color:"rgba(255,255,255,.7)",fontSize:12,marginTop:2}}>{filteredM.length} orang</div>
            </div>
            <button onClick={onClose} style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",width:34,height:34,borderRadius:10,fontSize:16,cursor:"pointer",fontWeight:800}}>✕</button>
          </div>
          {status!=="N"&&(
            <div style={{background:"rgba(255,255,255,.15)",borderRadius:10,padding:"10px 12px"}}>
              <div style={{color:"rgba(255,255,255,.85)",fontSize:10,fontWeight:700,marginBottom:6,letterSpacing:.5,textTransform:"uppercase"}}>
                {status==="X"?"Kondisi: ≥ 2 KPI tinggi bersamaan":"Kondisi: 1 KPI tinggi"}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {KPI_KEYS.map(k=>(
                  <span key={k} style={{background:"rgba(255,255,255,.25)",color:"#fff",borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:600}}>
                    {KPI[k].label}: {KPI[k].ref}
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
        {/* List */}
        <div style={{flex:1,overflowY:"auto",padding:16}}>
          {filteredM.length===0&&(
            <div style={{textAlign:"center",padding:"48px 20px",color:"#94a3b8"}}>
              <div style={{fontSize:40,marginBottom:8}}>🎉</div>
              <div style={{fontSize:14}}>Tidak ada member di kategori ini</div>
            </div>
          )}
          {usedDepts.map(dept=>{
            const dm=filteredM.filter(m=>m.bagian===dept);
            return (
              <div key={dept} style={{marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:deptColor(dept),flexShrink:0}}/>
                  <span style={{fontWeight:800,fontSize:12,color:"#1e3a2f",textTransform:"uppercase",letterSpacing:.4}}>{dept}</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>({dm.length})</span>
                </div>
                {dm.map(m=>{
                  const bad=getKpiBad(m);
                  const latMo=getLatestMonth(m);
                  return (
                    <div key={m.id} onClick={()=>onSelectMember(m)}
                      style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:12,
                        border:"1.5px solid #e2e8f0",marginBottom:6,cursor:"pointer",background:"#f8fafc",transition:"all .15s"}}
                      onMouseEnter={e=>{e.currentTarget.style.background="#f0fdf4";e.currentTarget.style.borderColor="#bbf7d0";}}
                      onMouseLeave={e=>{e.currentTarget.style.background="#f8fafc";e.currentTarget.style.borderColor="#e2e8f0";}}>
                      <Avatar nama={m.nama} status={status} size={38}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:13,color:"#1e3a2f"}}>{m.nama}</div>
                        <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{m.usia} thn · {m.gender}{latMo&&` · ${latMo}`}</div>
                        {bad.length>0&&(
                          <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:4}}>
                            {bad.map(k=>(
                              <span key={k} style={{background:jc.bg,color:jc.tx,border:`1px solid ${jc.bd}`,
                                borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>
                                {KPI[k].label} {KPI[k].ref}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                      <span style={{color:"#94a3b8",fontSize:16}}>›</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── KPI REFERENCE CARD ───────────────────────────────────────────────────────
function KpiRefCard() {
  const [open,setOpen]=useState(false);
  return (
    <div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",marginBottom:14,overflow:"hidden"}}>
      <button onClick={()=>setOpen(o=>!o)}
        style={{width:"100%",padding:"12px 16px",display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
        <span style={{fontSize:16}}>📋</span>
        <span style={{fontWeight:700,fontSize:13,color:"#1e3a2f"}}>Referensi Nilai KPI Kesehatan</span>
        <span style={{marginLeft:"auto",color:"#059669",fontWeight:700,fontSize:12}}>{open?"Tutup ▲":"Lihat ▼"}</span>
      </button>
      {open&&(
        <div style={{padding:"0 16px 16px"}}>
          <div style={{background:"#f0fdf4",borderRadius:10,padding:"10px 14px",marginBottom:10,fontSize:12,color:"#065f46",lineHeight:1.8}}>
            <strong>Klasifikasi Status Member:</strong><br/>
            🚨 <strong>BAHAYA</strong> — ≥ 2 dari 4 KPI tinggi secara bersamaan<br/>
            ⚠️ <strong>PERHATIAN</strong> — tepat 1 dari 4 KPI tinggi<br/>
            ✅ <strong>NORMAL</strong> — tidak ada KPI yang tinggi
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead><tr style={{background:"#f0fdf4"}}>
                {["Indikator","Nilai Tinggi","Referensi"].map(h=>(
                  <th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:700,color:"#065f46",borderBottom:"1.5px solid #d1fae5",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr></thead>
              <tbody>{KPI_KEYS.map((k,i)=>(
                <tr key={k} style={{background:i%2===0?"#fff":"#f8fafc"}}>
                  <td style={{padding:"7px 10px",fontWeight:700,color:"#1e3a2f",whiteSpace:"nowrap"}}>{KPI[k].label}</td>
                  <td style={{padding:"7px 10px",color:"#dc2626",fontWeight:700,whiteSpace:"nowrap"}}>{KPI[k].ref}</td>
                  <td style={{padding:"7px 10px",color:"#6b7280",fontSize:10,lineHeight:1.4}}>{KPI[k].refFull}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          <div style={{fontSize:10,color:"#94a3b8",marginTop:8,lineHeight:1.5}}>
            * Sumber: AHA/ACC 2017, ADA 2024, JNC 8, WHO, Kemenkes RI 2021. Berlaku untuk pria & wanita dewasa.
          </div>
        </div>
      )}
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({members,isAdmin,onAdd,onSelect,onLogout,saving}) {
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("Semua");
  const [statusPanel,setStatusPanel]=useState(null);
  const [collapsed,setCollapsed]=useState({});

  const counts=members.reduce((a,m)=>{
    const s=getKpiStatus(m); if(s)a[s]=(a[s]||0)+1; else a.nd=(a.nd||0)+1; return a;
  },{N:0,W:0,X:0,nd:0});

  const filteredAll=members.filter(m=>{
    if(filterStatus!=="Semua"&&getKpiStatus(m)!==filterStatus)return false;
    return m.nama.toLowerCase().includes(search.toLowerCase())||
           m.bagian.toLowerCase().includes(search.toLowerCase());
  });

  const usedDepts=DEPTS.filter(d=>filteredAll.some(m=>m.bagian===d));
  const toggle=d=>setCollapsed(p=>({...p,[d]:!p[d]}));

  const hdr=isAdmin?"linear-gradient(135deg,#064e3b 0%,#059669 100%)":"linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)";

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc"}}>
      {/* Header */}
      <div style={{background:hdr,padding:"16px 20px",position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 12px rgba(0,0,0,.15)"}}>
        <div className="wide" style={{display:"flex",alignItems:"center",justifyContent:"space-between",maxWidth:940,margin:"0 auto"}}>
          <div>
            <div style={{color:"#fff",fontWeight:900,fontSize:18}}>{isAdmin?"💉":"📊"} Health Monitor</div>
            <div style={{color:"rgba(255,255,255,.7)",fontSize:11,marginTop:1}}>
              {isAdmin?"Admin · Suster":"Viewer · Management"} · {saving?"🔄 Menyimpan…":"🟢 Real-time"}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {isAdmin&&<button onClick={onAdd} style={{background:"#fff",color:"#059669",border:"none",borderRadius:12,padding:"8px 16px",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Tambah</button>}
            <button onClick={onLogout} style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"1.5px solid rgba(255,255,255,.3)",borderRadius:12,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>Keluar</button>
          </div>
        </div>
      </div>

      <div className="wide" style={{padding:"20px 16px",maxWidth:940,margin:"0 auto"}}>
        {/* Stat Cards */}
        <div className="stat-row animate-in" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {[
            {s:null,n:members.length,l:"Total Member",bg:"#f0fdf4",c:"#059669",bd:"#bbf7d0",e:"👥",click:false},
            {s:"N",n:counts.N,l:"Normal",bg:"#dcfce7",c:"#16a34a",bd:"#4ade80",e:"✅",click:true},
            {s:"W",n:counts.W,l:"Perhatian",bg:"#fef9c3",c:"#a16207",bd:"#facc15",e:"⚠️",click:true},
            {s:"X",n:counts.X,l:"Bahaya",bg:"#fee2e2",c:"#dc2626",bd:"#f87171",e:"🚨",click:true},

                  cursor:"pointer",userSelect:"none",transition:"background .1s"}}
                onMouseEnter={e=>e.currentTarget.style.background="#f0fdf4"}
                onMouseLeave={e=>e.currentTarget.style.background="#f8fafc"}>
                <div style={{width:10,height:10,borderRadius:"50%",background:dcol,flexShrink:0,boxShadow:`0 0 0 2px ${dcol}30`}}/>

                </div>
                <span style={{color:"#94a3b8",fontSize:18,fontWeight:700,transform:isCollapsed?"rotate(0)":"rotate(90deg)",transition:"transform .2s",marginLeft:4}}>›</span>
              </div>

              {/* Members */}
              {!isCollapsed&&dm.map((m,i)=>{
                const st=getKpiStatus(m);

                return (

                      <div style={{fontWeight:700,fontSize:14,color:"#1e3a2f",marginBottom:3}}>{m.nama}</div>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:11,color:"#94a3b8"}}>{m.usia} thn · {m.gender}</span>
                        {getLatestMonth(m)&&<span style={{background:"#f1f5f9",color:"#64748b",borderRadius:4,padding:"0 5px",fontSize:10,fontWeight:600}}>{getLatestMonth(m)}</span>}
                      </div>
                      {bad.length>0&&(
                        <div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap"}}>
                          {bad.map(k=>(
                            <span key={k} style={{background:st==="X"?"#fee2e2":"#fef9c3",
                              color:st==="X"?"#991b1b":"#92400e",border:`1px solid ${st==="X"?"#f87171":"#facc15"}`,
                              borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>
                              {KPI[k].label}↑
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                      <StatusBadge j={st}/>
                      <div style={{display:"flex",gap:3}}>
                        {MONTHS.map(mo=>(
                          <div key={mo} title={`${mo}: ${monthFill(m,mo)}%`}
                            style={{width:22,height:5,borderRadius:3,
                              background:monthFill(m,mo)===100?"#22c55e":monthFill(m,mo)>0?"#f59e0b":"#e2e8f0"}}/>
                        ))}
                      </div>
                    </div>
                    <span style={{color:"#cbd5e1",fontSize:18,marginLeft:2}}>›</span>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      {statusPanel&&(
        <StatusPanel status={statusPanel} members={members}
          onSelectMember={m=>{setStatusPanel(null);onSelect(m);}}

    </div>
  );
}

// ─── SETUP SCREEN ─────────────────────────────────────────────────────────────
function SetupScreen({onSave}) {
  const [aPin,setAPin]=useState(""); const [vPin,setVPin]=useState("");
  const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const submit=async()=>{
    if(aPin.length!==4||!/^\d{4}$/.test(aPin))return setErr("PIN Admin harus 4 digit angka");
    if(vPin.length!==4||!/^\d{4}$/.test(vPin))return setErr("PIN Viewer harus 4 digit angka");
    if(aPin===vPin)return setErr("PIN Admin dan Viewer harus berbeda");
    setLoading(true);
    try{ await fbSaveConfig({admin:aPin,viewer:vPin}); onSave({admin:aPin,viewer:vPin}); }
    catch(e){ setErr("Gagal menyimpan: "+e.message); setLoading(false); }
  };
  const inp={width:"100%",padding:"14px",borderRadius:12,border:"1.5px solid #e2e8f0",
    fontSize:24,fontFamily:"monospace",fontWeight:700,textAlign:"center",outline:"none",
    background:"#f8fafc",color:"#1e3a2f",letterSpacing:10};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#064e3b,#047857)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div className="animate-in" style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:24,
        padding:"40px 28px",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:52,marginBottom:12}}>⚙️</div>
          <h2 style={{fontWeight:900,fontSize:22,color:"#1e3a2f",margin:0}}>Setup Pertama</h2>
          <p style={{color:"#64748b",fontSize:13,margin:"8px 0 0",lineHeight:1.6}}>Buat PIN untuk Admin & Viewer.<br/>Dilakukan hanya sekali.</p>
        </div>
        {[["💉 PIN Admin (Suster)",aPin,setAPin],["📊 PIN Viewer (Management)",vPin,setVPin]].map(([lbl,val,set],i)=>(
          <div key={i} style={{marginBottom:16}}>
            <label style={{fontSize:12,fontWeight:700,color:"#065f46",marginBottom:6,display:"block"}}>{lbl}</label>
            <input style={inp} type="password" inputMode="numeric" maxLength={4} placeholder="••••"
              value={val} onChange={e=>set(e.target.value.replace(/\D/g,""))}/>
          </div>
        ))}
        {err&&<div style={{color:"#dc2626",fontSize:13,fontWeight:600,background:"#fee2e2",borderRadius:10,padding:"10px 14px",marginBottom:16}}>⚠️ {err}</div>}
        <button onClick={submit} disabled={loading}
          style={{width:"100%",background:loading?"#94a3b8":"linear-gradient(135deg,#059669,#047857)",
            color:"#fff",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:800,cursor:loading?"wait":"pointer"}}>
          {loading?"⏳ Menyimpan ke Firebase…":"Simpan & Mulai →"}
        </button>
      </div>
    </div>
  );
}

          <div style={{display:"flex",gap:10}}>

                  <span key={k} style={{background:bad?"#fee2e2":"#dcfce7",color:bad?"#991b1b":"#15803d",
                    borderRadius:6,padding:"2px 7px",fontSize:10,fontWeight:700,border:`1px solid ${bad?"#f87171":"#4ade80"}`}}>
                    {KPI[k].label}{bad?"↑":"✓"}
                  </span>
                ):null;
              })}
            </div>
          </div>
          <div className="pgrid" style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
            {PARAMS.map(p=>{
              const val=data[mo]?.[p.key]||"";
              const j=PARAM_JUDGE[p.key]?.judge(val,member.gender,member.usia)||null;
              const isKpi=KPI_KEYS.includes(p.key);
              const kpiBad=isKpi&&val&&KPI[p.key].isTinggi(val);
              const jc_=j?(JC[j]||JC[null]):JC[null];
              return (
                <div key={p.key} style={{background:val?jc_.bg+"80":"#f8fafc",borderRadius:14,padding:"12px 14px",
                  border:`${isKpi?"2px":"1.5px"} solid ${val?jc_.bd:"#e2e8f0"}`,transition:"all .2s",position:"relative"}}>
                  {isKpi&&<div style={{position:"absolute",top:6,right:8,background:kpiBad?"#fee2e2":"#dcfce7",
                    color:kpiBad?"#991b1b":"#15803d",border:`1px solid ${kpiBad?"#f87171":"#4ade80"}`,
                    borderRadius:4,padding:"1px 5px",fontSize:9,fontWeight:700}}>KPI</div>}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <label style={{fontWeight:700,fontSize:13,color:"#1e3a2f"}}>
                      {p.label} {p.unit&&<span style={{fontSize:11,color:"#94a3b8",fontWeight:400}}>({p.unit})</span>}
                    </label>
                    {val&&kpiBad&&<span style={{background:"#fee2e2",color:"#991b1b",borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700,border:"1px solid #f87171"}}>🚨 Tinggi</span>}
                    {val&&!kpiBad&&j&&<StatusBadge j={j} small/>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input style={{flex:1,padding:"9px 12px",borderRadius:10,
                      border:`1.5px solid ${val?jc_.bd:"#e2e8f0"}`,background:val?jc_.bg:"#fff",
                      color:"#1e3a2f",outline:"none",fontSize:15,fontFamily:"monospace",fontWeight:700}}
                      placeholder={p.ph} value={val} disabled={isViewer}
                      onChange={e=>set(p.key,e.target.value)}/>
                    <span style={{fontSize:11,color:"#94a3b8",whiteSpace:"nowrap",flexShrink:0}}>
                      {isKpi?`KPI: ${KPI[p.key].ref}`:PARAM_JUDGE[p.key]?.std}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Rekap table */}
        <div style={{background:"#fff",borderRadius:20,border:"1px solid #e2e8f0",overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"14px 20px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#065f46",textTransform:"uppercase",letterSpacing:.5}}>Rekap 3 Bulan</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{background:"#f8fafc"}}>
                <th style={{textAlign:"left",padding:"8px 16px",color:"#6b7280",fontWeight:700,borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap"}}>Parameter</th>
                {MONTHS.map(m=><th key={m} colSpan={2} style={{textAlign:"center",padding:"8px",color:"#6b7280",fontWeight:700,borderBottom:"1px solid #f1f5f9"}}>{m}</th>)}
              </tr></thead>
              <tbody>{PARAMS.map((p,pi)=>(
                <tr key={p.key} style={{background:pi%2===0?"#fff":"#f8fafc"}}>
                  <td style={{padding:"7px 16px",fontWeight:KPI_KEYS.includes(p.key)?800:600,color:"#374151",whiteSpace:"nowrap"}}>
                    {p.label}
                    {KPI_KEYS.includes(p.key)&&<span style={{background:"#f0fdf4",color:"#059669",borderRadius:4,padding:"0 4px",fontSize:9,fontWeight:700,marginLeft:4}}>KPI</span>}
                  </td>
                  {MONTHS.map(m=>{
                    const v=data[m]?.[p.key]||"";
                    const j=PARAM_JUDGE[p.key]?.judge(v,member.gender,member.usia)||null;
                    const kpiBad=KPI_KEYS.includes(p.key)&&v&&KPI[p.key].isTinggi(v);
                    const jc_=j?(JC[j]||JC[null]):JC[null];
                    return [
                      <td key={m+"v"} style={{textAlign:"center",padding:"7px 4px",fontWeight:700,color:v?jc_.tx:"#cbd5e1"}}>{v||"—"}</td>,
                      <td key={m+"j"} style={{textAlign:"center",padding:"6px 8px"}}>
                        {kpiBad&&<span style={{background:"#fee2e2",color:"#991b1b",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:700}}>↑KPI</span>}
                        {!kpiBad&&v&&<StatusBadge j={j} small/>}
                      </td>,
                    ];
                  })}
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>

        {!isViewer&&(
          <div style={{display:"flex",gap:10,paddingBottom:32}}>
            <button onClick={()=>onDelete(member.id)}
              style={{flex:1,background:"#fff",color:"#dc2626",border:"1.5px solid #fca5a5",borderRadius:14,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>🗑 Hapus</button>
            <button onClick={handleSave} disabled={saving}
              style={{flex:2,background:saving?"#94a3b8":"linear-gradient(135deg,#059669,#047857)",
                color:"#fff",border:"none",borderRadius:14,padding:"13px",fontSize:14,fontWeight:800,cursor:saving?"wait":"pointer"}}>
              {saving?"🔄 Menyimpan…":"💾 Simpan Data "+mo}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── LOADING SCREEN ───────────────────────────────────────────────────────────
function LoadingScreen({text="Menghubungkan ke Firebase…"}) {
  return (
    <div style={{minHeight:"100vh",background:"#064e3b",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}>
      <div style={{fontSize:52}}>🏥</div>
      <div style={{color:"#6ee7b7",fontSize:16,fontWeight:700}}>{text}</div>
      <div style={{width:44,height:44,border:"4px solid rgba(110,231,183,.25)",borderTop:"4px solid #6ee7b7",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [members,setMembers]=useState([]);
  const [config,setConfig]=useState(null);
  const [screen,setScreen]=useState("loading");
  const [role,setRole]=useState(null);
  const [pinErr,setPinErr]=useState(false);
  const [selected,setSelected]=useState(null);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    let unsubMembers=null;
    // Load PIN config
    configDoc().get()
      .then(snap=>{
        if(snap.exists){
          setConfig(snap.data()); setScreen("home");
          // Start real-time listener for members
          unsubMembers = membersCol().orderBy("nama").onSnapshot(
            snap=>setMembers(snap.docs.map(d=>({id:d.id,...d.data()}))),
            err=>console.error("Firestore error:",err)
          );
        } else {
          setScreen("setup");
        }
      })
      .catch(e=>{
        console.error("Firebase config error:",e);
        setScreen("setup");
      });
    return ()=>{ if(unsubMembers)unsubMembers(); };
  },[]);

  const startMembersListener=()=>{
    membersCol().orderBy("nama").onSnapshot(
      snap=>setMembers(snap.docs.map(d=>({id:d.id,...d.data()}))),
      err=>console.error(err)
    );
  };

  const handlePin=pin=>{
    if(role==="admin"&&pin===config.admin){setPinErr(false);setScreen("admin");}
    else if(role==="viewer"&&pin===config.viewer){setPinErr(false);setScreen("viewer");}
    else setPinErr(true);
  };

  const handleSaveMember=async m=>{
    setSaving(true);
    try{ await fbSaveMember(m); if(selected?.id===m.id)setSelected(m); }
    catch(e){alert("Gagal menyimpan: "+e.message);}
    setSaving(false);
  };
  const handleDelete=async id=>{
    if(!confirm("Hapus member ini?"))return;
    setSaving(true);
    try{ await fbDeleteMember(id); setSelected(null); setScreen(role==="admin"?"admin":"viewer"); }
    catch(e){alert("Gagal hapus: "+e.message);}
    setSaving(false);
  };
  const handleAdd=async m=>{ await handleSaveMember(m); setScreen("admin"); };
  const handleSetup=async pins=>{
    try{
      await fbSaveConfig(pins); setConfig(pins); setScreen("home");
      startMembersListener();
    }catch(e){alert("Firebase error: "+e.message);}
  };

  if(screen==="loading") return <LoadingScreen/>;
  if(screen==="setup")   return <SetupScreen onSave={handleSetup}/>;
  if(screen==="home")    return <HomeScreen onRole={r=>{setRole(r);setPinErr(false);setScreen("pin");}}/>;
  if(screen==="pin")     return <PinScreen role={role} onSuccess={handlePin} onBack={()=>setScreen("home")}/>;

  if(screen==="admin")   return <Dashboard members={members} isAdmin saving={saving}
    onAdd={()=>setScreen("add")} onSelect={m=>{setSelected(m);setScreen("form");}} onLogout={()=>setScreen("home")}/>;
  if(screen==="add")     return <AddMemberScreen onSave={handleAdd} onBack={()=>setScreen("admin")}/>;

  if(screen==="viewer")  return <Dashboard members={members} isAdmin={false} saving={false}
    onAdd={()=>{}} onSelect={m=>{setSelected(m);setScreen("form-view");}} onLogout={()=>setScreen("home")}/>;

  if(screen==="form"&&selected)     return <MemberFormScreen member={selected} onSave={handleSaveMember} onDelete={handleDelete} onBack={()=>setScreen("admin")}/>;
  if(screen==="form-view"&&selected) return <MemberFormScreen member={selected} onSave={()=>{}} onDelete={()=>{}} onBack={()=>setScreen("viewer")} isViewer/>;

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
